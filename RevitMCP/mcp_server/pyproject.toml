[project]
name = "revit-mcp-server"
version = "1.0.0"
description = "Servidor MCP que conecta Claude con Revit 2024 a través del add-in RevitMCP"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2.0"]

[project.scripts]
revit-mcp-server = "revit_mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["revit_mcp_server.py"]
